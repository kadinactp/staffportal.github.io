<!DOCTYPE html><html><head><base target="_blank"><style>
*{box-sizing:border-box}body{margin:0;color:#17362b;background:#fff;font:13px system-ui,sans-serif}main{padding:4px 2px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}p{margin:8px 0;color:#576e64}button,a{font:inherit}button{background:#eaf4ee;color:#205b40;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.5}.entry{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e0eae3;padding:10px 0;min-height:57px}.pdf{padding:9px 7px;color:#a82b27;background:#fff0ee;border-radius:9px;font-size:11px;font-weight:800}.detail{flex:1;min-width:0;overflow-wrap:anywhere}small{display:block;color:#576e64;margin-top:3px}a{color:#185b40;font-weight:700;text-decoration:none;padding:8px;border-radius:8px;background:#edf5f0;white-space:nowrap}a:focus,button:focus{outline:2px solid #2479b8}
</style></head><body><main><header><p id="status" role="status">Checking dashboard access…</p><button id="refresh" hidden>Refresh</button></header><div id="list"></div></main><script>
(()=>{const portal='https://kadinactp.github.io';const base="https://script.google.com/a/macros/kadinactp.com/s/AKfycbxpBAYazBSvrGMXLoKXl5OUwJhngx4dVg1sXWysEex7Tx7t2lY2Nmtc5sqDdRquK2rv/exec";const status=document.getElementById('status'),list=document.getElementById('list'),refresh=document.getElementById('refresh');
// The compact frame is read-only. Refuse to render in unrecognised frame chains.
const origins=Array.from(location.ancestorOrigins||[]);const trusted=o=>{try{const u=new URL(o);return u.protocol==='https:'&&(u.origin===portal||u.hostname==='script.google.com'||u.hostname.endsWith('.googleusercontent.com')||u.hostname==='script.googleusercontent.com')}catch{return false}};
if(!origins.length||origins[origins.length-1]!==portal||!origins.every(trusted)){status.textContent='Open the full Reports Centre to view reports securely.';return}
function load(){refresh.disabled=true;status.textContent='Loading recent reports…';list.replaceChildren();google.script.run.withSuccessHandler(rows=>{refresh.disabled=false;const recent=rows.slice(0,5);status.textContent=recent.length?'Latest received reports':'No reports available yet.';recent.forEach(x=>{const row=document.createElement('div');row.className='entry';const icon=document.createElement('span');icon.className='pdf';icon.textContent='PDF';const detail=document.createElement('div');detail.className='detail';const title=document.createElement('strong');title.textContent=x.name;const meta=document.createElement('small');meta.textContent=new Date(x.date).toLocaleString('en-AU',{timeZone:'Australia/Adelaide',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+' · '+x.category;detail.append(title,meta);const link=document.createElement('a');link.href=base+'?report='+encodeURIComponent(x.id)+'&part='+encodeURIComponent(x.index);link.target='_blank';link.rel='noopener noreferrer';link.textContent='View / print ↗';row.append(icon,detail,link);list.append(row)})}).withFailureHandler(()=>{refresh.disabled=false;status.textContent='Reports unavailable. Open the full Reports Centre.'}).listReports()}
refresh.hidden=false;refresh.onclick=load;load();})();
</script></body></html>
