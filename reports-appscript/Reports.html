<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f3f8f4,#e8f3f3);color:#17362b;font:14px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}.hero{padding:32px;border-radius:22px;background:linear-gradient(115deg,#174c35,#2f8b61,#267ca0);color:white;margin-bottom:18px}h1{margin:8px 0;font-size:32px}p{line-height:1.5}.card{background:#fff;border:1px solid #dce8e2;border-radius:18px;padding:18px;margin:12px 0}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border:1px solid #dce8e2;border-radius:9px;background:white}button{cursor:pointer;color:#fff;background:#226b4c}button:disabled{opacity:.5}input{flex:1;min-width:150px}.entry{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e4ede7}.details{flex:1;overflow-wrap:anywhere}.icon{background:#fff0ee;color:#a82b27;padding:12px;border-radius:10px;font-weight:bold}small{color:#576e64}iframe{width:100%;height:75vh;border:0}a{color:#226b4c}#viewer[hidden]{display:none}@media(max-width:600px){main{padding:12px}.entry{flex-wrap:wrap}.hero{padding:20px}}
</style></head><body><main><div class="hero"><small style="color:white">KADINA CARAVAN &amp; TOURIST PARK</small><h1>Reports Centre</h1><p>Secure, read-only daily and weekly PDF reports.</p></div><div class="card"><div class="filters"><input id="query" placeholder="Search report name or subject"><select id="category"><option value="">All categories</option><option>Housekeeping</option><option>Arrivals</option><option>Departures</option><option>Occupancy</option><option>Other</option></select><input type="date" id="date" aria-label="Report received date"><button id="refresh">Refresh</button></div><p id="status" role="status">Loading reports…</p><div id="list"></div></div><section id="viewer" class="card" hidden><h2 id="filename"></h2><p><a id="download" download>Download PDF</a> · Use your PDF viewer's print controls.</p><button id="close">Close report</button><iframe id="pdf" title="PDF report"></iframe></section></main><script>
let reports=[],url=null;const el=id=>document.getElementById(id);const dateKey=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Adelaide',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);function fail(){el('status').textContent='Unable to retrieve reports. Check your account and try again.';el('refresh').disabled=false}function refresh(){el('refresh').disabled=true;el('status').textContent='Loading reports…';google.script.run.withSuccessHandler(r=>{reports=r;el('refresh').disabled=false;render()}).withFailureHandler(fail).listReports()}function render(){const q=el('query').value.toLowerCase(),c=el('category').value,d=el('date').value;const rows=reports.filter(x=>(x.name+' '+x.subject).toLowerCase().includes(q)&&(!c||x.category===c)&&(!d||dateKey(new Date(x.date))===d));el('status').textContent=rows.length+' report(s) · latest 90 days · up to 200 PDFs';el('list').replaceChildren();rows.forEach(x=>{const row=document.createElement('div');row.className='entry';const icon=document.createElement('span');icon.className='icon';icon.textContent='PDF';const info=document.createElement('div');info.className='details';const name=document.createElement('strong');name.textContent=x.name;const meta=document.createElement('small');meta.textContent=new Date(x.date).toLocaleString('en-AU',{timeZone:'Australia/Adelaide'})+' · '+x.category;info.append(name,document.createElement('br'),meta);const btn=document.createElement('button');btn.textContent='View PDF';btn.onclick=()=>{btn.disabled=true;google.script.run.withSuccessHandler(p=>{btn.disabled=false;close();const raw=atob(p.base64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));el('filename').textContent=p.name;el('download').href=url;el('download').download=p.name;el('pdf').src=url;el('viewer').hidden=false;el('viewer').scrollIntoView({behavior:'smooth'})}).withFailureHandler(()=>{btn.disabled=false;fail()}).getReport(x.id,x.index)};row.append(icon,info,btn);el('list').append(row)})}function close(){el('pdf').removeAttribute('src');el('download').removeAttribute('href');if(url)URL.revokeObjectURL(url);url=null;el('viewer').hidden=true}['query','category','date'].forEach(id=>el(id).addEventListener('input',render));el('refresh').onclick=refresh;el('close').onclick=close;refresh();
</script></body></html>
